<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tìm Gợi ý Sản phẩm | Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <span class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 6px;"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
    RecSys AI
  </span>
  <a href="index.html">Giới thiệu</a>
  <a href="search.html" class="active">Tìm gợi ý</a>
  <a href="dashboard.html">Model card</a>
</nav>

<div class="container">
  <h1>Tìm Sản phẩm Gợi ý</h1>
  <p class="subtitle">Khám phá các sản phẩm thường được mua kèm bằng cách gõ tên hoặc mã sản phẩm (vd: "lunch bag", "heart").</p>

  <div class="card" style="position: relative; z-index: 50;">
    <label for="query">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 6px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Tìm kiếm sản phẩm (Tiếng Anh)
    </label>
    <div class="search-box" style="margin-top: 14px;">
      <input type="text" id="query" placeholder="Gõ ít nhất 2 ký tự (vd: bag, vintage)..." autocomplete="off">
      <ul class="suggestions" id="suggestions"></ul>
    </div>
    <p class="hint">Tìm theo tên tiếng Anh gốc trong tập dữ liệu Online Retail.</p>
  </div>

  <div class="card" id="selectedCard" style="display:none; border: 2px solid var(--primary); background: #ffffff; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.2);">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <label>Sản phẩm đã chọn</label>
        <div style="font-size: 1.3rem; font-weight: 700; color: var(--text-main);" id="selectedName"></div>
        <div class="code" id="selectedCode" style="font-family: monospace; color: var(--primary); margin-top: 6px; font-size: 1.05rem;"></div>
      </div>
      <div style="text-align: right; width: 140px;">
        <label for="k">Số lượng gợi ý</label>
        <input type="number" id="k" value="10" min="1" max="50" style="padding: 10px 14px; text-align: center;">
      </div>
    </div>
  </div>

  <div id="resultArea" style="margin-top: 40px;"></div>
</div>

<script src="api.js"></script>
<script>
  const queryInput = document.getElementById("query");
  const suggestionsBox = document.getElementById("suggestions");
  const selectedCard = document.getElementById("selectedCard");
  const selectedName = document.getElementById("selectedName");
  const selectedCode = document.getElementById("selectedCode");
  const kInput = document.getElementById("k");
  const resultArea = document.getElementById("resultArea");
  let currentCode = null;

  const onType = debounce(async (q) => {
    if (q.length < 2) { suggestionsBox.innerHTML = ""; return; }
    try {
      const data = await API.searchProducts(q, 10);
      suggestionsBox.innerHTML = data.results.length
        ? data.results.map(it =>
            `<li data-code="${it.stock_code}" data-name="${it.description}">
               <span>${it.description}</span>
               <span class="code">${it.stock_code}</span>
             </li>`).join("")
        : `<li style="justify-content: center; color: var(--text-muted); background: transparent;"><span style="text-align:center;">Không tìm thấy sản phẩm phù hợp</span></li>`;
    } catch (e) {
      suggestionsBox.innerHTML = `<li style="color: var(--error); background: transparent;">Lỗi tìm kiếm: ${e.message}</li>`;
    }
  }, 250);

  queryInput.addEventListener("input", (e) => onType(e.target.value.trim()));

  suggestionsBox.addEventListener("click", (e) => {
    const li = e.target.closest("li[data-code]");
    if (!li) return;
    selectProduct(li.dataset.code, li.dataset.name);
  });

  function selectProduct(code, name) {
    currentCode = code;
    selectedCard.style.display = "block";
    selectedName.textContent = name;
    selectedCode.textContent = code;
    suggestionsBox.innerHTML = "";
    queryInput.value = "";
    
    // Add smooth pop animation to selected card
    selectedCard.style.transform = 'scale(0.98)';
    setTimeout(() => selectedCard.style.transform = 'scale(1)', 100);
    
    loadRecommendations();
  }

  kInput.addEventListener("change", () => { if (currentCode) loadRecommendations(); });

  async function loadRecommendations() {
    const k = Number(kInput.value);
    if (k < 1 || k > 50) {
      resultArea.innerHTML = `<div class="state-box error">Số lượng gợi ý phải trong khoảng 1–50</div>`;
      return;
    }
    resultArea.innerHTML = `<div class="state-box">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: pulseGlow 2s infinite; color: var(--primary);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      <br><br>Đang phân tích và gợi ý...
    </div>`;
    try {
      const data = await API.similarItems(currentCode, k);
      if (!data.recommendations.length) {
        resultArea.innerHTML = `<div class="state-box">Không có gợi ý nào đủ tin cậy cho sản phẩm này.</div>`;
        return;
      }
      
      // Delay slightly for effect
      setTimeout(() => {
        resultArea.innerHTML = `
          <h3 style="display: flex; align-items: center; gap: 10px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            Gợi ý tốt nhất (${data.recommendations.length} sản phẩm)
          </h3>
          <ul class="item-list" style="margin-top: 20px;">
            ${data.recommendations.map((it, idx) => `
              <li style="animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: ${idx * 0.05}s; opacity: 0;">
                <div>
                  <span class="name">${it.description || "(không có tên)"}</span>
                  <span class="code" style="margin-top:6px; display:block;">${it.stock_code}</span>
                </div>
                <div style="text-align: right;">
                  <span class="score" style="display: block;">${it.score.toFixed(4)}</span>
                  <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">Cosine Score</span>
                </div>
              </li>`).join("")}
          </ul>`;
      }, 300);
      
    } catch (e) {
      resultArea.innerHTML = `<div class="state-box error">${e.message}</div>`;
    }
  }
</script>
</body>
</html>
